[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pci-tokenization-service"
version = "0.1.0"
description = "PCI DSS 4.0-compliant tokenization service POV — Jack Henry Associates"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "cryptography>=42",
    "redis>=5",
    "google-cloud-kms>=2.21",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27",
    "pytest>=8",
    "pytest-anyio",
    "anyio[trio]",
    "locust>=2.24",
    "ruff>=0.4",
    "mypy>=1.9",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
